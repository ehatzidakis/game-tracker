<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Questloggd</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- The background chosen in Settings (core/ground.ts), set before anything draws so the
         page never flashes black first. -->
    <script>
      try {
        var g = localStorage.getItem('ground');
        var c = { charcoal: '#0e0e10', midnight: '#080b12', graphite: '#161618' }[g];
        if (c) {
          document.documentElement.dataset.ground = g;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
        }
      } catch (e) {}
    </script>
    <!-- Home-screen app on iPhone: a solid black status bar, with the app starting below it.
         black-translucent (drawing under the status bar) made iOS 26 size the app 47pt short. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Questloggd" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=3" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- ?v= makes iOS fetch the icon again instead of reusing an old one. -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=3" />
  </head>
  <body>
    <app-root>
      <!-- Shown while the app downloads; Angular replaces it when it starts. -->
      <div class="fixed inset-0 grid place-items-center" role="status" aria-label="Loading">
        <div class="size-8 rounded-full border-2 border-raised border-t-muted animate-spin"></div>
      </div>
    </app-root>
  </body>
</html>

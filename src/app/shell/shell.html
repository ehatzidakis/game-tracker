<!--
  Mobile-only app frame. The frame fills the screen and never scrolls; only <main> scrolls.
  iOS 26 home-screen apps misplace `position: fixed; bottom: 0` bars until the page is scrolled,
  so the tab bar is a normal row at the bottom of the frame instead of floating over the page.
  On a PC browser it stays phone-width, centred.
  It fills the screen from just under the status bar. The strip that stops iOS 27 blurring the
  top edge (see app.ts) covers its first 12px, so back screens (and the game's artwork) start
  12px down; tab screens start higher, like a native app's, with their title clear of the strip.
-->
<div class="fixed inset-x-0 top-0 bottom-0 mx-auto flex max-w-md flex-col bg-ground">
  <div class="relative min-h-0 flex-1">
    <!-- Top bar, only on screens with a back button. On the game screen it's see-through over the
         artwork; once that scrolls away it turns into a blurred bar with the game's name. Other
         back screens (Gaming events) get room for it above their large title. Tab screens have
         no bar: their top (.pinned-top) slides away as you scroll down and back as you scroll
         up, like YouTube's. -->
    @if (route().back) {
      <header class="absolute inset-x-0 top-0 z-20 pt-[calc(12px+env(safe-area-inset-top))]">
        <!-- Once scrolled: the page fades and blurs into the top of the screen, with no hard
             edge or line (like iOS 26). Its own layer, so the button and title stay sharp. -->
        <div
          class="top-fade pointer-events-none absolute inset-x-0 top-0 -bottom-5 transition-opacity duration-200"
          [class.opacity-0]="!scrolled()"
          aria-hidden="true"
        ></div>
        <div class="relative flex h-14 items-center px-3">
          <button
            type="button"
            class="glass-button z-10 grid size-11 place-items-center rounded-full text-white active:scale-95"
            aria-label="Back"
            (click)="back()"
          >
            <svg lucideChevronLeft [size]="26" [strokeWidth]="2.25" class="-ml-0.5"></svg>
          </button>
          <p
            class="pointer-events-none absolute inset-x-16 truncate text-center text-[17px] font-bold transition-opacity duration-200"
            [class.opacity-0]="!titleShown()"
            [attr.aria-hidden]="!titleShown()"
          >
            {{ title() }}
          </p>
        </div>
      </header>
    } @else {
      <!-- Tab screens: while their top is slid away, the page fades out under the status bar
           (solid over the iOS 27 strip, then 16px of fade), with no hard edge. -->
      <div
        class="tab-top-fade pointer-events-none absolute inset-x-0 top-0 z-20 transition-opacity duration-300"
        [class.opacity-0]="!topHidden()"
        aria-hidden="true"
      ></div>
    }

    <!-- overflow-x-hidden: overflow-y:auto would otherwise let wide content scroll sideways.
         It rubber-bands at both ends; a tab screen's top is fixed over it (shared/pinned-top.ts),
         so pulling down at the top moves only the list, under the title, as in YouTube. -->
    <main
      #scroller
      class="h-full overflow-y-auto overflow-x-hidden overscroll-contain px-4"
      [class.is-scrolled]="!atTop()"
      [class.top-hidden]="topHidden()"
      [style.padding-top]="
        route().hero
          ? '12px'
          : route().back
            ? 'calc(68px + env(safe-area-inset-top))'
            : 'max(0px, calc(var(--pinned-h, 0px) - 0.5rem))'
      "
    >
      <router-outlet />
      <!-- Room to scroll the last item above the floating tab bar. A real element rather than
           bottom padding, which Safari doesn't always count in a scrolling area. -->
      <div class="h-[calc(var(--tab-bar-space)+24px)]" aria-hidden="true"></div>
    </main>
  </div>

  <!-- Floating tab bar, as in Apple's own apps: a frosted capsule over the content, which
       scrolls underneath it. It's placed inside the app frame rather than pinned to the screen
       (iOS 26 misplaces bars pinned to the screen's bottom edge), just above the home indicator. -->
  <nav class="tab-bar absolute inset-x-4 z-30 grid grid-cols-4 p-1" aria-label="Main">
    <!-- One highlight that slides between tabs (moved by transform, so it stays smooth). -->
    <span
      class="tab-pill"
      [style.transform]="'translateX(' + 100 * (activeTab() < 0 ? 0 : activeTab()) + '%)'"
      [class.opacity-0]="activeTab() < 0"
      aria-hidden="true"
    ></span>
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="tab-active"
        ariaCurrentWhenActive="page"
        class="relative flex h-13.5 flex-col items-center justify-center gap-0.75 rounded-full text-[10.5px] leading-none font-semibold tracking-normal text-label/80"
      >
        @switch (tab.path) {
          @case ('/calendar') {
            <svg lucideCalendarDays [size]="24" [strokeWidth]="1.75" class="block"></svg>
          }
          @case ('/library') {
            <svg lucideLibraryBig [size]="24" [strokeWidth]="1.75" class="block"></svg>
          }
          @case ('/search') {
            <svg lucideSearch [size]="24" [strokeWidth]="1.75" class="block"></svg>
          }
          @case ('/settings') {
            <svg lucideSettings [size]="24" [strokeWidth]="1.75" class="block"></svg>
          }
        }
        <span>{{ tab.label }}</span>
      </a>
    }
    <app-toast />
  </nav>
  <app-choice-sheet />
  <app-details-sheet />
  <app-event-sheet />
</div>

<!--
  Mobile-only app frame. The frame fills the screen and never scrolls; only <main> scrolls.
  iOS 26 home-screen apps misplace `position: fixed; bottom: 0` bars until the page is scrolled,
  so the tab bar is a normal row at the bottom of the frame instead of floating over the page.
  On a PC browser it stays phone-width, centred.
  It starts 12px down, below the strip that stops iOS 27 blurring the top edge (see app.ts),
  so artwork under the see-through top bar isn't cut off by it.
-->
<div class="fixed inset-x-0 top-3 bottom-0 mx-auto flex max-w-md flex-col bg-ground">
  <div class="relative min-h-0 flex-1">
    <!-- Top bar, only on screens with a back button (the game screen): see-through over the
         artwork; once that scrolls away it turns into a blurred bar with the game's name. Tab
         screens have no bar: their large title and its action scroll away with the page. -->
    @if (route().back) {
      <header
        class="absolute inset-x-0 top-0 z-20 pt-[env(safe-area-inset-top)] transition-[background-color,border-color] duration-200"
        [class]="
          scrolled()
            ? 'border-b-[0.5px] border-sep bg-[rgb(22_22_24/0.9)] backdrop-blur-xl backdrop-saturate-150'
            : 'border-b-[0.5px] border-transparent'
        "
      >
        <div class="relative flex h-11 items-center px-2">
          <button
            type="button"
            class="z-10 grid size-9 place-items-center rounded-full transition-colors duration-200"
            [class]="scrolled() ? 'text-accent' : 'bg-black/45 text-white backdrop-blur-md'"
            aria-label="Back"
            (click)="back()"
          >
            <svg lucideChevronLeft [size]="24" [strokeWidth]="2.25" class="-ml-0.5"></svg>
          </button>
          <p
            class="pointer-events-none absolute inset-x-14 truncate text-center text-[17px] font-semibold transition-opacity duration-200"
            [class.opacity-0]="!titleShown()"
            [attr.aria-hidden]="!titleShown()"
          >
            {{ title() }}
          </p>
        </div>
      </header>
    }

    <!-- overflow-x-hidden: overflow-y:auto would otherwise let wide content scroll sideways. -->
    <main
      #scroller
      class="h-full overflow-y-auto overflow-x-hidden overscroll-contain px-4 pb-[calc(var(--tab-bar-space)+16px)]"
      [style.padding-top]="route().hero ? '0' : 'calc(12px + env(safe-area-inset-top))'"
      (scroll)="onScroll()"
    >
      <router-outlet />
    </main>
  </div>

  <!-- Floating tab bar, as in Apple's own apps: a frosted capsule over the content, which
       scrolls underneath it. It's placed inside the app frame rather than pinned to the screen
       (iOS 26 misplaces bars pinned to the screen's bottom edge), just above the home indicator. -->
  <nav class="tab-bar absolute inset-x-4 z-30 grid grid-cols-4 p-1" aria-label="Main">
    <!-- One highlight that slides between tabs (moved by transform, so it stays smooth). -->
    <span
      class="tab-pill"
      [style.transform]="'translateX(' + 100 * (activeTab() < 0 ? 0 : activeTab()) + '%)'"
      [class.opacity-0]="activeTab() < 0"
      aria-hidden="true"
    ></span>
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="tab-active"
        ariaCurrentWhenActive="page"
        class="relative flex h-[54px] flex-col items-center justify-center gap-[3px] rounded-full text-[10.5px] leading-none font-semibold tracking-normal text-label/80"
      >
        @switch (tab.path) {
          @case ('/calendar') {
            <svg lucideCalendarDays [size]="24" [strokeWidth]="1.75" class="block"></svg>
          }
          @case ('/library') {
            <svg lucideLibraryBig [size]="24" [strokeWidth]="1.75" class="block"></svg>
          }
          @case ('/search') {
            <svg lucideSearch [size]="24" [strokeWidth]="1.75" class="block"></svg>
          }
          @case ('/settings') {
            <svg lucideSettings [size]="24" [strokeWidth]="1.75" class="block"></svg>
          }
        }
        <span>{{ tab.label }}</span>
      </a>
    }
    <app-toast />
  </nav>
  <app-choice-sheet />
  <app-preorder-sheet />
</div>
